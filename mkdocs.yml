theme:
  name: material
  font:
    text: Raleway
  favicon: images/favicon.png
  icon:
    logo: fontawesome/solid/cubes-stacked
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
  features:
    # Don't fully reload the page for internal links
    - navigation.instant
    # Inject anchors into the URL
    - navigation.tracking
    # Allow section headings to have their own pages
    - navigation.indexes
    # Automatically scroll navigation sidebar to location on page
    - toc.follow
plugins:
  - search
  - glightbox
  - git-revision-date-localized:
      type: date
      enable_creation_date: true
      fallback_to_build_date: true
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.keys
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/glsdown
  # Don't show this is material for mkdocs
  generator: false
